name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5', '8.6']
        illuminate: ['^12.0', '^13.0']
        dependencies: [prefer-lowest, prefer-stable]

    name: PHP ${{ matrix.php }} / Illuminate ${{ matrix.illuminate }} / ${{ matrix.dependencies }}

    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, dom, xml, xmlwriter
          tools: composer:v2
          coverage: none

      - name: Install dependencies
        run: composer update --with="illuminate/collections:${{ matrix.illuminate }}" --${{ matrix.dependencies }} --prefer-dist --no-interaction

      - run: composer validate --strict

      - run: composer test

  quality:
    runs-on: ubuntu-latest
    name: Pint and PHPStan

    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - run: composer update --prefer-dist --no-interaction

      - run: composer test:lint

      - run: composer analyse
